<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="gpa.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css" />
    <title>SGPA Calculator.</title>
  </head>
  <body>
    <div class="container">
      <h1>GPA Calculator</h1>
      <p>Based on the grading system utilized by the Pokhara University.</p>
      <select name="credit" class="credit">
        <option value="">Credit</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
      <select name="grade" class="grade">
        <option value="">Grade</option>
        <option value="4.0">A</option>
        <option value="3.7">A-</option>
        <option value="3.3">B+</option>
        <option value="3.0">B</option>
        <option value="2.7">B-</option>
        <option value="2.3">C+</option>
        <option value="2.0">C</option>
        <option value="1.7">C-</option>
        <option value="1.3">D+</option>
        <option value="1.0">D</option>
        <option value="0">F</option>
      </select>
      <button class="delete-btn">🗑</button>
      <button id="course">Add Course</button>
      <button id="calculate">Calculate</button>
      <p class="result">Your SGPA is: <span id="sgpa">0.00</span></p>
    </div>
  </body>
</html>
