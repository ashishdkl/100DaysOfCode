<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Quotes Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="document.png" type="image/x-icon" />
  </head>
  <body>
    <div class="container">
      <h1>Random Quotes</h1>
      <p>You can generate Quotes according to your requirements</p>
      <label for="quoteCount">
        Enter the Amount of Quotes you want to generate</label
      >
      <input type="number" placeholder="Number" id="quoteCount" />
      <button id="btn">Generate</button>
    </div>
    <div class="display">
      <p>Here are the quotes that you generate</p>
      <div class="displayContainer"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
